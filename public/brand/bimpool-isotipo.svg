<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>BIMpool isotipo</title>
  <rect width="64" height="64" rx="14" fill="#1a2942"/>
  <!-- cubo isométrico: cara superior naranja, izquierda gris, derecha blanco frío -->
  <polygon points="32,12 50,22 32,32 14,22" fill="#ff6b35"/>
  <polygon points="14,22 32,32 32,52 14,42" fill="#a7b0bf"/>
  <polygon points="32,32 50,22 50,42 32,52" fill="#f7f9fc"/>
  <!-- línea de corte / eje: guiño a la documentación BIM -->
  <line x1="32" y1="32" x2="32" y2="52" stroke="#1a2942" stroke-width="1.2" opacity="0.35"/>
</svg>
